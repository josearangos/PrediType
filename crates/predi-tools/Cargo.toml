[package]
name = "predi-tools"
description = "PrediType developer tools: asset builder, manual CLI, evaluation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
predi-core = { path = "../predi-core" }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
sha2 = "0.11.1"
memory-stats = "1.2.0"
fst = "0.4.7"
unicode-normalization = "0.1.25"

[lib]
name = "predi_tools"
path = "src/lib.rs"

[[bin]]
name = "predi-build"
path = "src/bin/predi-build.rs"

[[bin]]
name = "predi-cli"
path = "src/bin/predi-cli.rs"

[[bin]]
name = "predi-eval"
path = "src/bin/predi-eval.rs"
